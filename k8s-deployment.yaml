    NG Audit Check - Equitas - DC - sivakumar@vunetsystems.com
    NG Audit Check - Hitachi - PROD - savithri@vunetsystems.com
    NG Audit Check - IBL - DC - shinde@vunetsystems.com
    NG Audit Check - ICICI - VuLogx DC - savithri@vunetsystems.com
    NG Audit Check - ICICI - VuLogx DR - savithri@vunetsystems.com
    NG Audit Check - Karnataka Bank - PROD - savithri@vunetsystems.com
    NG Audit Check - Network International Jordan - PROD - rajaram@vunetsystems.com
    NG Audit Check - NPCI - CTS - vaibhav@vunetsystems.com
    NG Audit Check - NPCI - EFRM - vaibhav@vunetsystems.com
