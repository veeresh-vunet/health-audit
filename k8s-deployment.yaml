---
# ── ConfigMap: subjects.txt ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ng-audit-subjects
  namespace: ng-audit
data:
  subjects.txt: |
    NG Audit Check - AU Small Finance Bank - DC
    NG Audit Check - Bank of Baroda - DR
    NG Audit Check - Bank of Baroda - DC
    NG Audit Check - Bajaj Financial Securities Limited - PROD
    NG Audit Check - care - dev
    NG Audit Check - Equitas - DC
    NG Audit Check - Hitachi - PROD
    NG Audit Check - IBL - DC
    NG Audit Check - ICICI - VuLogx DC
    NG Audit Check - ICICI - VuLogx DR
