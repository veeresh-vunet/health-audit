metadata:
  name: ng-audit-secrets
  namespace: ng-audit
type: Opaque
stringData:
  EMAIL_PASSWORD:   ""
  CH_PASSWORD:      ""
  GREEN_API_TOKEN:  ""

---
# ── ConfigMap: subjects.txt ────────────────────────────────────────────────────
